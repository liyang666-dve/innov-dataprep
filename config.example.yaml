# innov-dataprep 配置模板 —— 拷成 config.yaml 后按机器填写
# 注意：config.yaml 已被 .gitignore 排除，不会提交到仓库

paths:
  # 采集机批次目录（一轮采集 = 一个子目录：output/arx/arx_MMDD_HHMM）
  batches: /home/arx/robodeploy/output/arx
  # 处理输出根目录（各脚本默认写入 <input>/../<name>_<stage>/，可改这里）
  output: /home/arx/dataprep_out
  # 台账文件（本机记录每批登记，汇总脚本会合并各机台账）
  ledger: /home/arx/data_catalog.csv

# 机型映射：info.json 的 robot_type -> 登记模板里的机型（innov / arx / self / unk）
robot_type_map:
  bi_innov_arm_v1: innov
  innov_arm: innov
  bi_arx_x5: arx
  arx_x5: arx
  self: self

defaults:
  machine: 采集机A          # 采集机名称（登记卡自动带入，可确认时改）
  operator: ""              # 操作员，留空则登记时输入
  version: v1               # 数据版本
  fps_nominal: 30           # 采集标称帧率（与 info.json 的 fps 不一致时以这里为准判断）
  task: ""                  # 任务名可留空，优先从 meta/tasks.jsonl 读

qc:
  # 03 清洗/质检阈值（软标记；默认值同 pipe/03_clean.py 的 DEFAULT_QC）
  min_duration_s: 3.0        # 短于此 -> 排除
  max_duration_s: 120.0      # 长于此 -> 警告
  fps_deviation: 0.15        # 实际帧率偏离标称超过 -> 排除
  max_drop_ratio: 0.05       # 丢帧估计占行数超过 -> 排除
  joint_limits_rad: 3.3      # |关节角| 超过 -> 排除
  joint_jump_rad: 0.8        # 相邻帧跳变超过(rad) -> 排除（定标后应远大于此值）
  joint_jump_review_rad: 0.8 # 单帧跳变复核线 -> review（低于排除线时兜底，防"定标太宽"漏判）
  stuck_s: 0.4               # 关节零方差持续超过 -> 排除
  # ⚠ 上面三项关节阈值是"未定标"的保守默认：真实 ARX 数据上照着跑 --joints 会把 93/93 集
  #   全判排除。先跑 `python3 tools/calibrate_qc.py --dir <批次目录> --max-episodes 0`，
  #   把 qc_suggested.yaml 的值粘回来（本机 13 批实测：joint_jump_rad=3.05 / stuck_s=55.1）
  blur_laplacian_thr: 3.0    # 帧 Laplacian 方差阈值（模糊判定，绝对阈值）
  blur_bad_ratio: 0.10       # 低清晰帧占比超过 -> 排除（需 --blur 才启用）
  blur_sample_frames: 200    # 每相机抽帧上限（控成本）
  # --- 统计信号（review 级：只提示、绝不排除；对标 lerobot-doctor / RDA）---
  zero_var_eps: 1.0e-6       # 某维标准差小于它 -> 常量维（review，通道没数据）
  action_spike_sigma: 8.0    # 逐维 |Δ| 超过 8×该维标准差 -> 尖峰（review）
  action_spike_min_abs: 0.5  # 且绝对跳变 >= 该值(rad) 才算尖峰（避免平滑抖动误报）
  stuck_dim_ratio: 0.8       # 单维不变帧占比超过 -> 记为僵死维（info，报告里汇总）
  idle_move_eps: 1.0e-3      # 单帧全维位移小于它算静止
  idle_ratio_warn: 0.90      # 静止帧占比超过 -> review（有效运动比 <10%）
  duration_outlier_sigma: 3.0 # 时长偏离均值超过 3σ -> review
  stats_drift_tol: 0.05      # meta/episodes_stats 与实测均值偏差超过该比例 -> review

doctor:
  # 11 第二意见：lerobot-doctor 只读体检（pip install lerobot-doctor 或 uv tool install）
  bin: ""                    # lerobot-doctor 可执行文件路径；留空=从 PATH 找
  max_episodes: 20           # 只检查前 N 集（大集强烈建议；留空/0=全部）

annotate:
  # —— 09 标注：VLM 逐集质量评分+建议（采集机能联网时启用；OpenAI 兼容接口，可填 DeepSeek/通义）——
  #    enabled: true 后还需填 base_url / model / api_key_env（环境变量名，存放 API Key）
  enabled: false
  base_url: ""
  model: ""
  api_key_env: ""

merge:
  # —— 预留占位：合并不用配这里，用 run.py 命令勾选批次（run.py merge 1,2,3）——
  inputs: []